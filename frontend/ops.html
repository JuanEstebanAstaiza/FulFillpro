<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FulfillPro · Ops</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="ops-shell">
    <div class="ops-card">
      <div class="ops-badge">Acceso restringido</div>
      <h1>Operaciones FulfillPro</h1>
      <p class="lead">Portal interno de la plataforma. No es el login de clientes.</p>
      <div id="ops-alert" class="hidden"></div>
      <form id="ops-form">
        <div class="field">
          <label for="email">Usuario</label>
          <input id="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Clave</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;background:linear-gradient(135deg,#334155,#0f172a);box-shadow:none">
          Entrar al panel
        </button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("ops-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alert = document.getElementById("ops-alert");
      alert.classList.add("hidden");
      try {
        const tokens = await API.loginPlatform(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        API.setTokens(tokens.access_token, tokens.refresh_token);
        window.location.href = "/ops/panel";
      } catch (err) {
        alert.className = "alert alert-error";
        alert.textContent = err.message || "Error";
        alert.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
