<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FulfillPro · Ops</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="ops-shell">
    <button type="button" class="theme-toggle theme-toggle-float" data-theme-toggle aria-pressed="false">
      <span class="theme-ico theme-ico-moon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
      </span>
      <span class="theme-ico theme-ico-sun" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </span>
    </button>
    <div class="ops-card">
      <div class="ops-badge">Acceso restringido</div>
      <h1>Operaciones FulfillPro</h1>
      <p class="lead">Portal interno de la plataforma. No es el login de clientes.</p>
      <div id="ops-alert" class="hidden"></div>
      <form id="ops-form">
        <div class="field">
          <label for="email">Usuario</label>
          <input id="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Clave</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;background:linear-gradient(135deg,#334155,#0f172a);box-shadow:none">
          Entrar al panel
        </button>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/ops.js"></script>
</body>
</html>
