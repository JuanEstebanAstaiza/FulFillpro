# FulfillPro — estabilidad alta concurrencia (100+ envíos Excel)
#
# Arquitectura:
#   api     → HTTP + validar + guardar + encolar Redis (NO procesa Excel)
#   worker  → consume cola, N Excel en paralelo (WORKER_CONCURRENCY)
#   redis   → cola de jobs (noeviction)
#   db      → PostgreSQL
#
# Variables sensibles y de entorno salen de .env (env_file + ${...}).
#
# RAM ~12 GB:
#   api 2G · worker 5–6G · db 3G · redis 512M
#
# Más paralelismo Excel:
#   docker compose up -d --build --scale worker=2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillpro
      POSTGRES_PASSWORD: fulfillpro
      POSTGRES_DB: fulfillpro
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillpro -d fulfillpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 450mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --tcp-backlog
      - "511"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Solo localhost en el host (Cloudflared en la misma VM)
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Red Docker interna (siempre)
      DATABASE_URL: postgresql+psycopg://fulfillpro:fulfillpro@db:5432/fulfillpro
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      STORAGE_MAX_GB: ${STORAGE_MAX_GB:-100}
      # Tomados del .env (sin pisar production con development)
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fulfillpro.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-8}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-80}
      PROCESS_MAX_QUEUE: ${PROCESS_MAX_QUEUE:-500}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_ROWS: ${MAX_ROWS:-60000}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_PROCESS: ${RATE_LIMIT_PROCESS:-150}
      RATE_LIMIT_PROCESS_IP: ${RATE_LIMIT_PROCESS_IP:-500}
    volumes:
      - ./storage:/app/storage
      - ./frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fulfillpro:fulfillpro@db:5432/fulfillpro
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      STORAGE_MAX_GB: ${STORAGE_MAX_GB:-100}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-6}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-40}
      MAX_ROWS: ${MAX_ROWS:-60000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      APP_ENV: ${APP_ENV:-production}
      SEED_DEMO_USERS: "false"
      JWT_SECRET: ${JWT_SECRET}
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPATH: /app
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 6g
    cpus: 3.0
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
