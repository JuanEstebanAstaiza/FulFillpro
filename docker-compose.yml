services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillpro
      POSTGRES_PASSWORD: fulfillpro
      POSTGRES_DB: fulfillpro
    # Red interna de Docker (sin publicar puertos al host).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillpro -d fulfillpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fulfillpro:fulfillpro@db:5432/fulfillpro

      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    volumes:
      - ./storage:/app/storage
      - ./frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
